<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi cuaca</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="cuaca-app">
        <h1 class="title">Cuaca Provinsi NTB ⛅</h1>
        <div class="input-wilayah">
            <div class="input-kabupaten">
                <h2 class="input-title">Pilih kab/kota</h2>
                <select id="kabupaten">
                    <option value="">Kab</option>
                    <option value="52.06">Bima</option>
                    <option value="52.05">Dompu</option>
                    <option value="52.01">Lombok Barat</option>
                    <option value="52.03">Lombok Timur</option>
                    <option value="52.02">Lombok Tengah</option>
                    <option value="52.08">Lombok Utara</option>
                    <option value="52.04">Sumbawa</option>
                    <option value="52.07">Sumbawa Barat</option>
                </select>
            </div>
            <div class="input-kecamatan">
                <h2 class="input-title">Pilih Kecamatan</h2>
                <select id="kecamatan">
                    <option value="">Kec</option>
                </select>
            </div>
            <div class="input-desa">
                <h2 class="input-title">Pilih Kel/Desa</h2>
                <select id="desa">
                    <option value="">Kel/Desa</option>
                </select>
            </div>
        </div>

        <div class="card-cuaca">
            <div class="header-card">
                <h2 class="suhu">3 &deg;</h2>
                <p class="desc-cuaca">Cerah</p>
                <p class="loc">Jereweh, Goa</p>
            </div>
            <div class="body-card">
                <ul class="detail">
                    <li>
                        <span class="label">Kelembapan </span>
                        <span class="nilai">20%</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
