<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi cuaca</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="cuaca-app">
        <h1 class="title">Cuaca Provinsi NTB ⛅</h1>
        <div class="input-wilayah">
            <div class="input-kabupaten">
                <h2 class="input-title">Pilih kab/kota</h2>
                <select id="kabupaten">
                    <option value="">Kab</option>
                    <option value="52.06">Bima</option>
                    <option value="52.05">Dompu</option>
                    <option value="52.01">Lombok Barat</option>
                    <option value="52.03">Lombok Timur</option>
                    <option value="52.02">Lombok Tengah</option>
                    <option value="52.08">Lombok Utara</option>
                    <option value="52.04">Sumbawa</option>
                    <option value="52.07">Sumbawa Barat</option>
                </select>
            </div>
            <div class="input-kecamatan">
                <h2 class="input-title">Pilih Kecamatan</h2>
                <select id="kecamatan">
                    <option value="">Kec</option>
                </select>
            </div>
            <div class="input-desa">
                <h2 class="input-title">Pilih Kel/Desa</h2>
                <select id="desa">
                    <option value="">Kel/Desa</option>
                </select>
            </div>
        </div>
        <!-- Card cuaca -->
        <article class="card-cuaca">
            <div class="panel-header">
                <p class="desc-lokasi">
                    <span class="desa">--</span>
                    <span class="waktu">--,--</span>
                </p>
            </div>


            <div class="panel-body">
                    <p class="desc-suhu">
                        <span>--<sup>&deg;</sup></span>
                    </p>
                    <p class="kondisi">--</p>
            </div>

            <div class="panel-footer">
                <div class="statistik">
                      <p><span class="label">Kelembapan</span> <b class="value">0%</b></p> 
                      <p><span class="label">Angin</span> <b class="value">0km/jam</b></p> 
                      <p><span class="label">Hujan</span> <b class="value">0mm</b></p> 
                </div>

                <ul class="perkiraan">
                        <li>
                            <p class="p-waktu">00.00</p>
                            <p class="p-suhu">2<sup>&deg;</sup></p>
                        </li>
                        <li>
                            <p class="p-waktu">00.00</p>
                            <p class="p-suhu">2<sup>&deg;</sup></p>
                        </li>
                        <li>
                            <p class="p-waktu">00.00</p>
                            <p class="p-suhu">2<sup>&deg;</sup></p>
                        </li>
                        <li>
                            <p class="p-waktu">00.00</p>
                            <p class="p-suhu">2<sup>&deg;</sup></p>
                        </li>
                </ul>

                <div class="source"><a href="https://bmkg.go.id" target="_blank">Source: Bmkg</a></div>
            </div>
        </article>
    </div>
    <script src="index.js"></script>
</body>

</html>
